# Netlify builds on every commit with `npm run build`. GitHub Actions syncs
# DayZ-Script-Diff (full models) and DayZ-Script-Diff-Experimental
# (data/experimental.json for Mod check), committing data/ when either moves.

[build]
  publish = "dist"
  command = "npm run build"

# Default NFT tracing follows ROOT/fs in src/util.js and ships data/ + .cache/
# with the workshop function (250 MB upload limit).
[functions]
  node_bundler = "esbuild"
  included_files = ["!data/**", "!.cache/**", "!dist/**"]

[functions."workshop"]
  included_files = ["site/workshop.json"]

[functions."doxygen"]
  included_files = ["site/doxygen-redirects.json"]

[[redirects]]
  from = "/api/workshop"
  to = "/.netlify/functions/workshop"
  status = 200

# Browsers keep what these headers allow; a deploy only purges Netlify's CDN.
# /_b/<sha> is named by its content, so a new body is always a new URL.
[[headers]]
  for = "/_b/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fixed URLs (styles.css, app.js, app/*.js, build lists), so a layout deploy
# reaches returning visitors within this window. Raise it only once asset
# URLs carry a content hash.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=600, stale-while-revalidate=3600"
